<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Workforce Intelligence — Login</title>
  <link rel="stylesheet" href="styles.css?v=9" />
  <link rel="stylesheet" href="login.css?v=2" />
</head>
<body>
  <div class="login-shell">
    <div class="login-brand">
      <div class="login-brand-icon">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div class="login-wordmark">Workforce<span>Intelligence</span></div>
    </div>

    <section id="emailStep" class="login-step">
      <h1>Welcome Back</h1>
      <div class="login-sub">Please login to continue</div>

      <form id="emailForm">
        <input type="email" id="emailInput" placeholder="Enter your work email" autocomplete="email" required />
        <button type="submit" class="login-btn" id="sendOtpBtn">Send OTP</button>
      </form>
      <div class="login-helper">Secure access with email OTP</div>
      <div class="login-error" id="emailError" hidden></div>
    </section>

    <section id="otpStep" class="login-step" hidden>
      <button type="button" class="login-back" id="backBtn" aria-label="Back">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>

      <div class="login-otp-icon">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h4l2 3h4l2-3h4"/><path d="M5.5 6h13l1.5 6v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6l1.5-6z"/></svg>
      </div>
      <h1>Verify Your Email</h1>
      <div class="login-sub">We've sent a 6-digit OTP to<br><strong id="otpEmailLabel"></strong></div>

      <form id="otpForm">
        <div class="otp-boxes" id="otpBoxes">
          <input inputmode="numeric" maxlength="1" class="otp-box" />
          <input inputmode="numeric" maxlength="1" class="otp-box" />
          <input inputmode="numeric" maxlength="1" class="otp-box" />
          <input inputmode="numeric" maxlength="1" class="otp-box" />
          <input inputmode="numeric" maxlength="1" class="otp-box" />
          <input inputmode="numeric" maxlength="1" class="otp-box" />
        </div>
        <div class="login-resend" id="resendRow">
          Resend OTP in <strong id="resendCountdown">00:45</strong>
        </div>
        <button type="button" class="login-link-btn" id="resendBtn" hidden>Resend OTP</button>
        <button type="submit" class="login-btn" id="verifyBtn">Verify OTP</button>
      </form>
      <div class="login-error" id="otpError" hidden></div>
    </section>

    <div class="login-footer">© 2026 Alcove Realty</div>
  </div>

  <script src="login.js?v=1"></script>
</body>
</html>
