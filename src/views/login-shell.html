<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Workforce Intelligence</title>
  <link rel="stylesheet" href="login.css?v=6" />
  <!-- Desktop-only "phone frame", same mechanism as workforce-shell.html:
  the real login/sign-up page (unchanged) loads at its own URL inside this
  iframe, clamped to a fixed mobile width on desktop so ITS OWN scrollbar
  hugs the edge of the narrow column instead of the browser window's far
  edge - matching exactly how the Dashboard behaves, as if this page were
  swapped into that same place. A real phone (viewport <= 430px) gets the
  frame at 100% width/height, so nothing changes there; see server.js's
  /login route for the same mobile/embedded bypass used by /workforce.html. -->
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      display: flex;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      padding: 0;
      background: var(--auth-bg-1);
    }
    #loginFrame {
      width: min(430px, 100vw);
      height: 100%;
      border: 0;
      background: var(--auth-bg-1);
    }
    @media (min-width: 431px) {
      #loginFrame {
        box-shadow: 0 26px 60px rgba(15, 23, 42, 0.24), 0 0 0 1px rgba(15, 23, 42, 0.06);
      }
    }
  </style>
</head>
<body>
  <iframe id="loginFrame" src="/login?embedded=1" title="Workforce Intelligence" allow="clipboard-write; web-share"></iframe>
</body>
</html>
