<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Workforce Intelligence</title>
  <link rel="stylesheet" href="styles.css?v=9" />
  <!-- Desktop-only "phone frame": the real app (unchanged) is loaded at its
  own URL inside this iframe. On a real phone (viewport <= 430px) the frame
  is exactly 100% width/height, so nothing here changes what a mobile
  visitor already sees - the frame only clamps to a fixed mobile width and
  grows a border/shadow once the viewport is wider than a phone. This gives
  the desktop-only true mobile layout (its own @media rules firing against
  the iframe's own narrow viewport) without touching workforce.css itself. -->
  <style>
    /* height:100% + overflow:hidden throughout (no min-height / padding /
    dual-calc height math) - a fixed-height flex container with a single
    100%-height child can't ever mismatch by a pixel and cause the outer
    page itself to need a scrollbar, unlike the previous version. */
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      display: flex;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      /* styles.css's shared body rule adds padding-bottom:76px (bottom-nav
      clearance on other pages) - with the global box-sizing:border-box
      that same file sets, that silently ate 76px off this 100dvh, which
      is what was shrinking the iframe and forcing an unwanted scrollbar. */
      padding: 0;
      background:
        radial-gradient(560px 320px at 50% -80px, var(--accent-bg), transparent),
        var(--paper);
    }
    #wfFrame {
      width: min(430px, 100vw);
      height: 100%;
      border: 0;
      background: var(--paper);
    }
    @media (min-width: 431px) {
      #wfFrame {
        box-shadow: 0 26px 60px rgba(15, 23, 42, 0.24), 0 0 0 1px rgba(15, 23, 42, 0.06);
      }
    }
  </style>
</head>
<body>
  <iframe id="wfFrame" src="/workforce.html?embedded=1" title="Workforce Intelligence" allow="clipboard-write; web-share"></iframe>
</body>
</html>
